name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint-backend:
    name: Lint Backend (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check --select E,F,W,I --ignore E501,E402,W293 app/ tests/

  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_analyst_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Seed database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_analyst_db
          REDIS_URL: redis://localhost:6379/0
          EMBEDDING_PROVIDER: mock
          RERANKER_PROVIDER: mock
          JINA_API_KEY: dummy
        run: |
          python scripts/ingest_all.py

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_analyst_db
          REDIS_URL: redis://localhost:6379/0
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_SQL_MODEL: llama-3.1-8b-instant
          GROQ_ROUTER_MODEL: llama-3.1-8b-instant
          EMBEDDING_PROVIDER: mock
          RERANKER_PROVIDER: mock
          JINA_API_KEY: dummy
          ENABLE_RERANKER: "true"
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build Docker Image
        uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318 # v6.0.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-analyst-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prepare-artifacts:
    name: Prepare Deployment Artifacts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint-backend, lint-frontend, test-backend, build-docker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Prepare Package files
        run: |
          mkdir -p release/frontend
          cp -r frontend/dist release/frontend/dist
          cp -r app release/app
          cp -r scripts release/scripts
          cp -r data release/data
          cp requirements.txt release/requirements.txt
          cp Dockerfile release/Dockerfile
          cp DEPLOYMENT.md release/DEPLOYMENT.md

      - name: Archive Release Package
        run: |
          cd release
          zip -r ../deployment-package.zip .

      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment-package.zip
          retention-days: 7

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [prepare-artifacts]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL" || echo "Deploy hook trigger skipped or failed."

      - name: Deploy Frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm install --global vercel
          vercel deploy --token "$VERCEL_TOKEN" --name ai-analyst-frontend --yes --prod --cwd frontend --build-env VITE_API_URL="$VITE_API_URL"

